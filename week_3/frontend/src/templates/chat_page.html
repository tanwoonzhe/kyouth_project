<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      :root { --accent: #5c5fcd; }

      body { background: #fff; }

      .chat-page-wrapper {
        display: flex;
        justify-content: center;
        padding: 60px 16px;
      }

      .chat-card { width: 100%; max-width: 800px; }

      .chat-history {
        background: #efefef;
        border-radius: 16px;
        height: 400px;
        overflow-y: auto;
        padding: 20px 24px;
      }

      .msg-row { display: flex; margin-bottom: 14px; }
      .msg-row.user { justify-content: flex-end; }
      .msg-row.bot  { justify-content: flex-start; }

      .bubble {
        max-width: 65%;
        padding: 10px 16px;
        font-size: 0.95rem;
        word-break: break-word;
      }
      .bubble.bot  { background: #fff; color: #212529; border-radius: 4px 16px 16px 16px; }
      .bubble.bot p { margin-bottom: 0.4em; }
      .bubble.bot p:last-child { margin-bottom: 0; }
      .bubble.bot ul, .bubble.bot ol { padding-left: 1.4em; margin-bottom: 0.4em; }
      .bubble.bot code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.88em; }
      .bubble.bot pre { background: #f0f0f0; padding: 8px 12px; border-radius: 6px; overflow-x: auto; font-size: 0.88em; }
      .bubble.user { background: var(--accent); color: #fff; border-radius: 16px 4px 16px 16px; }

      .input-bar {
        display: flex;
        align-items: center;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        padding: 6px 12px;
        margin-top: 12px;
        background: #fff;
      }
      .input-bar input[type=text] {
        flex: 1;
        border: none;
        outline: none;
        padding: 6px 8px;
        font-size: 1rem;
        background: transparent;
      }

      .btn-upload {
        background: none;
        border: none;
        cursor: pointer;
        color: #6c757d;
        padding: 4px 6px;
        line-height: 1;
      }
      .btn-upload:hover { color: var(--accent); }

      .btn-send {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 22px;
        font-size: 0.95rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-send:hover { filter: brightness(0.9); }

      .pdf-badge { font-size: 0.8rem; color: #6c757d; margin-top: 4px; padding-left: 4px; min-height: 1.2em; }

      .chat-history::-webkit-scrollbar { width: 5px; }
      .chat-history::-webkit-scrollbar-track { background: transparent; }
      .chat-history::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

      .stats-link {
        position: fixed;
        top: 16px;
        right: 24px;
        color: #6c757d;
        font-size: 0.9rem;
        text-decoration: none;
      }
      .stats-link:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <a href="/stats" class="stats-link">📊 Stats</a>

    <div class="chat-page-wrapper">
      <div class="chat-card">
        <div class="chat-history" id="chatHistory"></div>

        <div class="input-bar">
          <button class="btn-upload" title="Upload PDF"
                  onclick="document.getElementById('pdfInput').click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 fill="currentColor" viewBox="0 0 16 16">
              <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
              <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
            </svg>
          </button>
          <input type="file" id="pdfInput" accept=".pdf" style="display:none">
          <input type="text" id="msgInput" placeholder="Type a message...">
          <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
        <div class="pdf-badge" id="pdfBadge"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <script>
      const chatHistory = document.getElementById('chatHistory');
      const msgInput    = document.getElementById('msgInput');
      const pdfInput    = document.getElementById('pdfInput');
      const pdfBadge    = document.getElementById('pdfBadge');

      pdfInput.addEventListener('change', () => {
        pdfBadge.textContent = pdfInput.files.length ? `📄 ${pdfInput.files[0].name}` : '';
      });

      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      function addMessage(text, role) {
        const row    = document.createElement('div');
        const bubble = document.createElement('div');
        row.className    = `msg-row ${role}`;
        bubble.className = `bubble ${role}`;
        if (role === 'bot') {
          bubble.innerHTML = marked.parse(text);
        } else {
          bubble.textContent = text;
        }
        row.appendChild(bubble);
        chatHistory.appendChild(row);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      async function sendMessage() {
        const text   = msgInput.value.trim();
        const hasPdf = pdfInput.files.length > 0;
        if (!text && !hasPdf) return;

        addMessage(text || '[PDF uploaded]', 'user');
        msgInput.value = '';

        const form = new FormData();
        form.append('message', text);
        if (hasPdf) {
          form.append('pdf', pdfInput.files[0]);
          pdfInput.value       = '';
          pdfBadge.textContent = '';
        }

        try {
          const res  = await fetch('/chat', { method: 'POST', body: form });
          const data = await res.json();
          addMessage(data.reply ?? JSON.stringify(data), 'bot');
        } catch {
          addMessage('Error: could not reach the backend.', 'bot');
        }
      }
    </script>
  </body>
</html>
